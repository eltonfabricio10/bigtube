name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  build-test:
    # Skip the version-bump commit the release workflow pushes, so it doesn't
    # re-trigger CI (and another release).
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 / libadwaita / GStreamer dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gettext

      - name: Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (workspace)
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

  audit:
    # Scan dependencies for known RustSec advisories. The app downloads and
    # executes external binaries, so a vulnerable dep is worth surfacing.
    # Blocking. Ignored advisories:
    # - RUSTSEC-2024-0436 (`paste`, unmaintained): transitive dep with no
    #   available fix and no known exploit.
    # - RUSTSEC-2026-0381 (`webpki-roots` 0.26.x): pulled transitively by
    #   `ureq` 2.x. We already pin the embedded roots crate to 1.0.10 in the
    #   lockfile, but RustSec still flags the 0.26 wrapper line. Revisit when
    #   migrating HTTP client stack to `ureq` 3.x.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0381
